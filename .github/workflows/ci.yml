name: Partial validation — NOT ready to merge

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Allowed tests with race detector (161 of 178; partial)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ACCOUNT_PARTIAL_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      # Lista cerrada revisada; no ejecutar ./... ni las pruebas aplazadas.
      # Las bases de cada fixture son sintéticas y efímeras; -p 1 evita colisión
      # de roles globales. No equivale a la suite completa.
      - run: psql --version
      - name: Run only the explicitly allowed selection
        run: python3 tools/ci/partial-tests.py
      - run: CGO_ENABLED=0 go build -trimpath -o account ./cmd/account
      - name: Explain the validation gap
        if: always()
        run: |
          {
            echo '## PARTIAL validation — do not merge or deploy'
            echo 'Only the 161 selected tests may run. 17 tests remain deferred.'
            echo 'The race detector applies only to this selection; the full suite is incomplete.'
            echo 'See docs/AUDIT-VALIDATION-STATUS.md and tools/ci/deferred-tests.tsv.'
          } >> "$GITHUB_STEP_SUMMARY"

  full-validation-pending:
    name: BLOCKED — full validation pending (17 deferred)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Keep incomplete validation visible and blocking
        run: |
          echo '::error::Full validation is incomplete: 17 tests are deferred. Keep this PR draft; do not merge or deploy.'
          echo '## BLOCKED: full validation is incomplete' >> "$GITHUB_STEP_SUMMARY"
          echo 'The partial checks do not certify the full suite or close the audit.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
