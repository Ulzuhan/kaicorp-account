name: Publish container image

# Publishes to GitHub Container Registry. GHCR needs no extra secrets: the token
# GitHub injects into the job is enough, provided packages: write is granted below.
#
# Which tags each event owns, and why they no longer overlap:
#
#   push to main   :main and :sha-<short>   — what is not released yet
#   push tag v*    :<version>, :<major>.<minor>, :<major> and :latest   — a release
#
# A branch push and a tag push are two separate runs, so they are two independent
# builds of the same source. While both of them minted :latest and :sha-<short>,
# releasing (push main, push the tag seconds later) left :latest and :1.0.1 on
# DIFFERENT digests of the same commit — there was no way to tell by digest that
# latest was the release — and both runs raced to write :sha-<short>, where the
# slower one won.
#
# Now the release build is the only one that mints :latest, and it is the same
# build that mints the semver ladder, so they are the same digest by construction.
# Pushing to main still publishes an image to try out; it just cannot claim to be
# the release any more.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sin `id-token: write` no se puede firmar por OIDC contra Sigstore, y sin
      # `attestations: write` no se puede guardar la attestation firmada. Los
      # dos son el motivo de que hasta ahora no hubiera firma: no es que
      # fallara, es que no se pedía el permiso.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # QEMU is what allows building the arm64 image on an amd64 runner, so the
      # image also runs on a Raspberry Pi or an ARM server. Note: the arm64 build has
      # not been run locally (that needs binfmt handlers registered on the host), so
      # the first run of this workflow is what actually proves it.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # Publish the native amd64 target. Add native runners before supporting
          # another architecture; do not silently switch to emulated builds.
          platforms: linux/amd64
          push: true
          # Metadatos de procedencia y SBOM que genera BuildKit y sube al
          # registro junto a la imagen.
          #
          # OJO CON LO QUE ESTO ES Y NO ES, porque aquí ponía que eran
          # «verificables con gh attestation verify» y es falso: BuildKit los
          # escribe como declaraciones in-toto EN CLARO, sin firma. Cubren la
          # integridad —el digest del índice los encadena— pero no el origen:
          # cualquiera con escritura en el paquete podría publicar una
          # procedencia inventada. Lo que sí firma es el paso de attestation de
          # más abajo, y eso es lo que verifica `gh attestation verify`.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the registry, so later builds do not reinstall
          # dependencies from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Un nombre de imagen tiene que ir en minúsculas y github.repository
      # conserva la U del usuario; metadata-action ya lo normaliza para los
      # tags, esto lo normaliza para el escáner.
      - id: ref
        run: echo "ref=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # LA FIRMA. Lo de arriba son metadatos; esto es lo que dice QUIÉN los hizo.
      #
      # Firma con la identidad OIDC de esta ejecución contra Sigstore: no hay
      # clave privada que guardar, rotar ni perder. La attestation queda en el
      # almacén de GitHub y, con `push-to-registry`, también junto a la imagen
      # en GHCR.
      #
      # GitHub sólo guarda attestations de repositorios públicos (o de
      # organización): en uno privado de usuario el paso falla con «Feature not
      # available». Mientras este repo sea privado, la imagen se publica sin
      # firma; el día que se haga público, la firma entra sola.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.ref.outputs.ref }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Y la puerta: se verifica lo que se acaba de firmar, aquí mismo. Un
      # release cuya firma no verifique se queda en rojo, y un rojo no se ancla
      # en producción.
      #
      # Qué impone cada bandera, que no es lo mismo y conviene no confundirlo
      # (comprobado en el código del CLI, pkg/cmd/attestation/verify/policy.go):
      #
      #   --repo            acota la búsqueda de attestations Y exige que la
      #                     extensión SourceRepositoryURI del certificado sea
      #                     este repositorio. Ya por sí solo descarta una
      #                     attestation de otro sitio.
      #   --signer-workflow ESTRECHA la identidad del firmante de «cualquier
      #                     workflow de este repositorio» a ESTE fichero. Es lo
      #                     que importa el día que haya más de un workflow con
      #                     permiso de firmar.
      #   --source-digest   exige que el commit del que se construyó sea éste.
      #   --source-ref      exige que la referencia sea ésta: sin ella, una
      #                     attestation legítima de otra rama o de otra etiqueta
      #                     del mismo repositorio pasaría.
      #
      # Las dos últimas son las que atan el artefacto a lo que se cree estar
      # publicando, y no sólo a quién lo publicó.
      - name: Verificar la firma de lo recién publicado
        if: ${{ !github.event.repository.private }}
        run: |
          gh attestation verify \
            "oci://${REGISTRY}/${IMAGEN}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/docker.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}"
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGEN: ${{ steps.ref.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # La puerta: la imagen recién publicada, escaneada capa a capa (SO base,
      # npm y pip incluidos) contra las bases de CVEs, y el workflow en ROJO si
      # hay altas o críticas CON arreglo disponible. Se escanea tras publicar y
      # no antes a propósito: el exportador local no admite las attestations, y
      # en este flujo nada se despliega sin mirar el workflow — un release en
      # rojo no se ancla en producción. ignore-unfixed porque sin parche no hay
      # acción posible, y un rojo permanente solo enseña a ignorar el color.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.ref.outputs.ref }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
        env:
          TRIVY_TIMEOUT: 20m
