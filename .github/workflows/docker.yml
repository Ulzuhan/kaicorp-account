name: Publish container image

# Publishes a native multi-arch (linux/amd64 + linux/arm64) image to GitHub
# Container Registry via per-arch native runners + manifest index merge (no QEMU).
#
# Which tags each event owns, and why they no longer overlap:
#
#   push to main   :main and :sha-<short>   — what is not released yet
#   push tag v*    :<version>, :<major>.<minor>, :<major> and :latest   — a release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & scan (${{ matrix.platform }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ref
        run: echo "ref=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.ref.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.ref.outputs.ref }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
          TRIVY_TIMEOUT: 20m

      - name: Export arch digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          printf '%s\n' "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/${{ matrix.slug }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge index & attest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ref
        run: echo "ref=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - id: merge
        name: Stage the multi-arch index under an attempt-specific tag
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_REF: ${{ steps.ref.outputs.ref }}
          DIGEST_DIR: ${{ runner.temp }}/digests
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          IMAGE="${REGISTRY}/${IMAGE_REF}"
          AMD64_DIGEST=$(cat "${DIGEST_DIR}/amd64")
          ARM64_DIGEST=$(cat "${DIGEST_DIR}/arm64")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$PRIVATE_REPOSITORY" == true ]]; then
            echo "A versioned release requires verified build provenance" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_EVENT_NAME" != push ]]; then
            echo "A versioned release requires a tag push" >&2
            exit 1
          fi
          CANDIDATE="${IMAGE}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$CANDIDATE" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"
          INDEX_DIGEST=$(docker buildx imagetools inspect "$CANDIDATE" --format '{{.Manifest.Digest}}')
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          INSPECT=$(docker buildx imagetools inspect "${IMAGE}@${INDEX_DIGEST}")
          echo "$INSPECT" | grep -q 'linux/amd64'
          echo "$INSPECT" | grep -q 'linux/arm64'
          echo "digest=${INDEX_DIGEST}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.ref.outputs.ref }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Verify provenance before publishing release tags
        if: ${{ !github.event.repository.private }}
        run: |
          gh attestation verify \
            "oci://${REGISTRY}/${IMAGEN}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/docker.yml" \
            --signer-digest "${GITHUB_SHA}" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --deny-self-hosted-runners
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGEN: ${{ steps.ref.outputs.ref }}
          DIGEST: ${{ steps.merge.outputs.digest }}

      - name: Promote the verified index without rebuilding
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.ref.outputs.ref }}
          DIGEST: ${{ steps.merge.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              [[ "$tag" == "$IMAGE":* ]]
              tags+=("$tag")
            fi
          done <<< "$TAGS"
          test "${#tags[@]}" -gt 0
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          for tag in "${tags[@]}"; do
            actual=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
            test "$actual" = "$DIGEST"
          done

  verify:
    name: Container candidate (${{ matrix.platform }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: account-candidate
          tags: type=raw,value=ci
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
      - name: Runtime contract
        run: docker run --rm --entrypoint sh account-candidate:ci -ec 'test "$(id -u)" = 10001; test -x /usr/local/bin/account'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: account-candidate:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
