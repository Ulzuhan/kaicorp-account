{{define "content"}}
<section class="ac-wrap">
  <h1>Sign in</h1>
  {{if .Error}}<div class="ac-error">{{.Error}}</div>{{end}}
  {{if .Flash}}<div class="ac-ok">{{.Flash}}</div>{{end}}
  <form class="ac-card ac-form" method="post" action="/entrar">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus value="{{.Email}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="ac-actions">
      <button class="btn btn-primary" type="submit">Sign in</button>
      <a class="ac-small" href="/recuperar">Forgot your password?</a>
    </div>
  </form>
  <p class="ac-note">No account yet? <a href="/registro{{if .Next}}?next={{.Next}}{{end}}">Create one</a>.</p>
</section>
{{end}}
