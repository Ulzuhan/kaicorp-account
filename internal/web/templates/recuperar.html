{{define "content"}}
<section class="ac-wrap">
  <h1>Reset your password</h1>
  <p class="ac-note">Tell us your email. If there is an account for it, you will get a link to choose a new password.</p>
  {{if .Error}}<div class="ac-error">{{.Error}}</div>{{end}}
  <form class="ac-card ac-form" method="post" action="/recuperar">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    <div class="ac-actions"><button class="btn btn-primary" type="submit">Send the link</button><a class="ac-small" href="/entrar">Back to sign in</a></div>
  </form>
</section>
{{end}}
